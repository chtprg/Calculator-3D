<!-- textura de papel, por cima de tudo (gerada em código) -->
<div id="papel" aria-hidden="true"></div>

<div id="app">
  <header class="topo">
    <h1 class="marca"><span>Caderninho</span></h1>
    <div class="topo-dir">
      <button class="sino" id="sino" type="button" aria-label="Lembretes" hidden><svg class="ic"><use href="#i-sino"/></svg><span class="bolinha" id="sino-n"></span></button>
      <button class="quem" id="quem" type="button" aria-label="Trocar de pessoa"></button>
    </div>
  </header>
  <main id="tela" tabindex="-1"></main>
  <nav class="abas" aria-label="Seções">
    <button type="button" data-aba="mes" aria-label="O mês"><svg class="ic"><use href="#i-mes"/></svg><span>Mês</span></button>
    <button type="button" data-aba="carteira" aria-label="Carteira: renda, cartões e dívidas"><svg class="ic"><use href="#i-cartao"/></svg><span>Carteira</span></button>
    <button type="button" class="anotar" id="anotar" aria-label="Anotar um gasto ou entrada"><svg class="ic"><use href="#i-mais"/></svg></button>
    <button type="button" data-aba="saude" aria-label="Saúde financeira, pra onde foi e dicas"><svg class="ic"><use href="#c-saude"/></svg><span>Saúde</span></button>
    <button type="button" data-aba="ajustes" aria-label="Ajustes"><svg class="ic"><use href="#i-ajustes"/></svg><span>Ajustes</span></button>
  </nav>
</div>

<!-- folha que sobe de baixo (anotar, cartão, fatura) -->
<div class="veu" id="veu" hidden></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" hidden></section>

<!-- tela de entrada: quem está anotando -->
<section class="entrada" id="entrada" hidden></section>

<!-- lembretes: fatura vencendo, conta atrasada, cópia de segurança -->
<dialog class="pergunta lembrete rabisco" id="lembrete" aria-labelledby="lembrete-txt"></dialog>

<!-- bilhete de confirmação (apagar, trocar…) -->
<dialog class="pergunta rabisco" id="pergunta" aria-labelledby="pergunta-txt">
  <p id="pergunta-txt"></p>
  <div class="linha-botoes">
    <button type="button" class="botao rabisco fino" value="nao" id="pergunta-nao">Deixa quieto</button>
    <button type="button" class="botao rabisco fino perigo" value="sim" id="pergunta-sim">Sim</button>
  </div>
</dialog>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="js/fatura.js"></script>
<script src="js/saude.js"></script>
<script src="js/dicas.js"></script>
<script src="js/bancos.js"></script>
<script src="js/dados.js"></script>
<script src="js/desenho.js"></script>
<script src="js/app.js"></script>
</body>
</html>
